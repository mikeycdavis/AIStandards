# AISTANDARDS-SCAFFOLD: this file is a template, not evidence. It selects rules and asserts nothing.
#
# Every rule in the catalog is listed at its catalog level, so nothing is lowered and nothing is
# declared not-applicable for you. Adopting the pack is a decision, and this file records none.
# It declares no `project` and no `applicability` block on purpose.
#
# HOW TO RECORD A RULE AS NOT APPLICABLE HONESTLY. Add a top-level `applicability` map keyed by rule
# id. Each entry needs `status` (applicable or not-applicable) and a `reason` saying why the rule's
# subject does not exist in this project, and should carry `revisitWhen`, the change that would make
# the declaration false, and optionally `reviewedAt` as YYYY-MM-DD. Shape, with placeholders only:
#
#   applicability:
#     <rule-id>:
#       status: not-applicable
#       reason: <why the rule's subject does not exist here>
#       revisitWhen: <the change that would make this untrue>
#
# An entry without a reason is indistinguishable from a rule somebody forgot. Not-applicable is a
# claim about the project, not an exception to the rule; the two never substitute for each other.
