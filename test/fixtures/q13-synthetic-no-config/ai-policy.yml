# SYNTHETIC TEST INPUT. Not a real project and not a real policy.
#
# Q13 reproduction: a repository with a manifest and no provider configuration, prompt or source file at all.
#
# Its not-applicable declarations exist only to isolate the verdict path of the rules a detector
# examines (EVALUATED_RULES in scripts/standards.mjs). They are not real applicability approvals:
# nobody reviewed them, and none may be copied into a real ai-policy.yml. The rules left applicable
# outside EVALUATED_RULES are not-evaluable, so they change neither status nor score.
# See Q13 in artifacts/project-plan-breakdown/08-open-questions.md and test/partial-assurance.test.mjs.
standardVersion: "0.1.0"
project: "q13-synthetic-no-config"

